  <dialog class="dialog skill-dialog" id="skillPreviewModal" aria-labelledby="modalTitle" aria-describedby="modalDescription">
    <div>
      <header>
        <span class="badge skill-category-badge" data-variant="outline" id="modalCategoryBadge">CATEGORY</span>
        <h2 id="modalTitle">Skill Name</h2>
        <p id="modalDescription"></p>
      </header>
      <section class="skill-dialog-body">
        <div class="modal-code-wrapper">
          <div class="modal-code-header">
            <span>CONSOLIDATED PROMPT PLAYBOOK</span>
            <span class="modal-tokens" id="modalTokens">~1,840 tokens</span>
          </div>
          <pre class="modal-code"><code id="modalPromptCode"></code></pre>
        </div>
      </section>
      <footer>
        <button type="button" class="btn" data-variant="outline" id="modalDismissBtn">Close</button>
        <button type="button" class="btn" data-variant="secondary" id="modalOpenInAppBtn">
          <i data-lucide="square-terminal" data-icon="inline-start"></i>
          <span>Open in Compiler App</span>
        </button>
        <button type="button" class="btn" id="modalCopyBtn">
          <i data-lucide="copy" data-icon="inline-start"></i>
          <span>Copy Full Prompt</span>
        </button>
      </footer>
      <button type="button" class="btn" data-variant="ghost" data-size="icon-sm" id="modalCloseBtn" aria-label="Close dialog">
        <i data-lucide="x"></i>
      </button>
    </div>
  </dialog>
