  <div class="modal-backdrop" id="skillPreviewModal" aria-hidden="true">
    <div class="modal-card">
      <div class="card-ambient-overlay"></div>
      <div class="modal-header">

          <span class="modal-cat-tag" id="modalCategoryBadge">CATEGORY</span>
          <h3 class="modal-title" id="modalTitle">Skill Name</h3>
        </div>
        <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="Close modal">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc" id="modalDescription"></p>
        <div class="modal-code-wrapper">

        <button type="button" class="btn btn-primary" id="modalCopyBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>

      </div>
    </div>
  </div>
